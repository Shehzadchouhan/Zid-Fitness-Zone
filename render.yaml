services:
  - type: web
    name: zid-fitness-performance
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: AUTH_SECRET
        generateValue: true
      - key: OWNER_NAME
        value: ZID Gym Owner
      - key: OWNER_EMAIL
        value: owner@yourdomain.com
      - key: OWNER_PASSWORD
        value: ChangeThisStrongPassword123!
